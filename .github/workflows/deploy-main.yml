    needs: [tag, build-user-agent-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-user-agent:${TAG} \
            -t ${{ env.GHCR }}/mclaude-user-agent:main \
            ${{ env.GHCR }}/mclaude-user-agent:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-user-agent:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  deploy-cp:
    name: Deploy control-plane
    needs: [tag, merge-control-plane, merge-spa]
    if: always() && !failure() && !cancelled()
    runs-on: [self-hosted, tailscale]
    environment: deploy-cp
    steps:
      - name: Fetch secrets from Bitwarden
        env:
          BW_SESSION: ${{ secrets.BW_SESSION }}
        run: |
          POSTGRES_PASSWORD=$(bw get password "mclaude postgres password")
          BOOTSTRAP_ADMIN_PASSWORD=$(bw get password "mclaude bootstrap admin password")
          BOOTSTRAP_ADMIN_EMAIL=$(bw get password "mclaude bootstrap admin email")
          [[ -n "$POSTGRES_PASSWORD" ]] || { echo "ERROR: mclaude postgres password is empty"; exit 1; }
          [[ -n "$BOOTSTRAP_ADMIN_PASSWORD" ]] || { echo "ERROR: mclaude bootstrap admin password is empty"; exit 1; }
          [[ -n "$BOOTSTRAP_ADMIN_EMAIL" ]] || { echo "ERROR: mclaude bootstrap admin email is empty"; exit 1; }
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$BOOTSTRAP_ADMIN_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$BOOTSTRAP_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=$BOOTSTRAP_ADMIN_EMAIL" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Ensure prerequisite secrets
        run: |
          kubectl create namespace mclaude-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mclaude-postgres \
            --from-literal=postgres-password="$POSTGRES_PASSWORD" \
            --namespace mclaude-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mclaude-control-plane \
            --from-literal=bootstrap-admin-password="$BOOTSTRAP_ADMIN_PASSWORD" \
            --namespace mclaude-system \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Cleanup failed releases
        run: |
          for release in mclaude-postgres mclaude-cp; do
            if helm status "$release" -n mclaude-system 2>/dev/null | grep -q "STATUS: failed"; then
              echo "Release $release is in failed state — uninstalling to clear SSA ownership"
              helm uninstall "$release" -n mclaude-system
            fi
          done

      - name: Helm deploy mclaude-postgres
        run: |
          helm upgrade --install mclaude-postgres ./charts/mclaude-postgres \
            --set existingSecret=mclaude-postgres \
            --namespace mclaude-system \
            --wait --timeout 5m

      - name: Helm deploy mclaude-cp
        env:
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          echo "Deploying control-plane at tag: ${IMAGE_TAG}"
          TS_IP=$(tailscale ip -4)
          helm upgrade --install "mclaude-cp" ./charts/mclaude-cp \
            -f ./charts/mclaude-cp/values-k3d-ghcr.yaml \
            --set controlPlane.image.tag="${IMAGE_TAG}" \
            --set spa.image.tag="${IMAGE_TAG}" \
            --set database.host=mclaude-postgres.mclaude-system.svc \
            --set database.passwordSecretRef=mclaude-postgres \
            --set "controlPlane.bootstrapAdminEmail=${BOOTSTRAP_ADMIN_EMAIL}" \
            --set "controlPlane.bootstrapAdminPassword=${BOOTSTRAP_ADMIN_PASSWORD}" \
            --set "ingress.externalDnsTarget=${TS_IP}" \
            --namespace mclaude-system \
            --force-conflicts \
            --wait --timeout 5m

      - name: Done
        run: echo "✓ CP deployed"

  deploy-worker:
    name: Deploy worker
    needs: [tag, deploy-cp, merge-session-agent, merge-controller-k8s]
    if: false
    runs-on: [self-hosted, tailscale]
    environment: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup failed worker release
        run: |
          if helm status mclaude-worker -n mclaude-worker 2>/dev/null | grep -q "STATUS: failed"; then
            echo "Release mclaude-worker is in failed state — uninstalling to clear SSA ownership"
            helm uninstall mclaude-worker -n mclaude-worker
          fi

      - name: Helm deploy worker
        env:
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          echo "Deploying worker at tag: ${IMAGE_TAG}"

          kubectl delete configmap mclaude-worker-session-agent-template -n mclaude-worker --ignore-not-found=true

          helm upgrade --install "mclaude-worker" ./charts/mclaude-worker \
            -f ./charts/mclaude-worker/values-k3d-ghcr.yaml \
            --set controlPlane.image.tag="${IMAGE_TAG}" \
            --set controller.image.tag="${IMAGE_TAG}" \
            --set sessionAgent.image.tag="${IMAGE_TAG}" \
            --namespace mclaude-worker \
            --force-conflicts \
            --wait --timeout 5m

      - name: Done
        run: echo "✓ Worker deployed"

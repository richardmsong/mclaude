name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  GHCR: ghcr.io/richardmsong

jobs:
  tag:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Compute image tag
        id: tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "value=main-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Image tag: main-${short_sha}"

  # ---------------------------------------------------------------------------
  # Control-plane
  # ---------------------------------------------------------------------------
  build-control-plane-binaries:
    name: Build control-plane binaries
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-control-plane/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-control-plane
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/control-plane-arm64 ./cmd/control-plane/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/control-plane-amd64 ./cmd/control-plane/
      - uses: actions/upload-artifact@v4
        with:
          name: control-plane-binaries
          path: mclaude-control-plane/dist/

  build-control-plane-image:
    name: Docker control-plane (${{ matrix.arch }})
    needs: [tag, build-control-plane-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: control-plane-binaries
          path: mclaude-control-plane/dist
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-control-plane
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-control-plane:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-control-plane:
    name: Merge control-plane manifest
    needs: [tag, build-control-plane-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-control-plane:${TAG} \
            -t ${{ env.GHCR }}/mclaude-control-plane:main \
            ${{ env.GHCR }}/mclaude-control-plane:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-control-plane:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # SPA
  # ---------------------------------------------------------------------------
  build-spa-image:
    name: Docker spa (${{ matrix.arch }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-web
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-spa:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-spa:
    name: Merge spa manifest
    needs: [tag, build-spa-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-spa:${TAG} \
            -t ${{ env.GHCR }}/mclaude-spa:main \
            ${{ env.GHCR }}/mclaude-spa:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-spa:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # Session-agent
  # ---------------------------------------------------------------------------
  build-session-agent-binaries:
    name: Build session-agent binaries
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-session-agent/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-session-agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/session-agent-arm64 ./cmd/session-agent/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/session-agent-amd64 ./cmd/session-agent/
      - uses: actions/upload-artifact@v4
        with:
          name: session-agent-binaries
          path: mclaude-session-agent/dist/

  build-session-agent-image:
    name: Docker session-agent (${{ matrix.arch }})
    needs: [tag, build-session-agent-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: session-agent-binaries
          path: mclaude-session-agent/dist
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-session-agent
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-session-agent:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-session-agent:
    name: Merge session-agent manifest
    needs: [tag, build-session-agent-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |

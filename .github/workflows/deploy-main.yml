          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-session-agent:${TAG} \
            -t ${{ env.GHCR }}/mclaude-session-agent:main \
            ${{ env.GHCR }}/mclaude-session-agent:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-session-agent:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # Controller-k8s
  # ---------------------------------------------------------------------------
  build-controller-k8s-binaries:
    name: Build controller-k8s binaries
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-controller-k8s/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-controller-k8s
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/controller-k8s-arm64 ./cmd/controller-k8s/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/controller-k8s-amd64 ./cmd/controller-k8s/
      - uses: actions/upload-artifact@v4
        with:
          name: controller-k8s-binaries
          path: mclaude-controller-k8s/dist/

  build-controller-k8s-image:
    name: Docker controller-k8s (${{ matrix.arch }})
    needs: [tag, build-controller-k8s-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: controller-k8s-binaries
          path: mclaude-controller-k8s/dist
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-controller-k8s
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-controller-k8s:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-controller-k8s:
    name: Merge controller-k8s manifest
    needs: [tag, build-controller-k8s-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$RUNNER_TEMP/docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-controller-k8s:${TAG} \
            -t ${{ env.GHCR }}/mclaude-controller-k8s:main \
            ${{ env.GHCR }}/mclaude-controller-k8s:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-controller-k8s:${TAG}-arm64


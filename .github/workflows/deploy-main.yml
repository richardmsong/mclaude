    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-user-agent/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-user-agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/user-agent-arm64 ./cmd/user-agent/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/user-agent-amd64 ./cmd/user-agent/
      - uses: actions/upload-artifact@v4
        with:
          name: user-agent-binaries
          path: mclaude-user-agent/dist/

  build-user-agent-image:

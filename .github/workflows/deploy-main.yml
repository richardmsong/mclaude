name: Deploy main

on:
  workflow_dispatch:

env:
  GHCR: ghcr.io/richardmsong

jobs:
  tag:
    name: Compute image tag
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Compute image tag
        id: tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "value=main-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Image tag: main-${short_sha}"

  # ---------------------------------------------------------------------------
  # Control-plane
  # ---------------------------------------------------------------------------
  build-control-plane-binaries:
    name: Build control-plane binaries
    needs: tag
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-control-plane/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-control-plane
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o control-plane-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o control-plane-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: control-plane-binaries
          path: |
            mclaude-control-plane/control-plane-arm64
            mclaude-control-plane/control-plane-amd64

  build-control-plane-image:
    name: Docker control-plane (${{ matrix.arch }})
    needs: [tag, build-control-plane-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: control-plane-binaries
          path: mclaude-control-plane
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-control-plane
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-control-plane:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-control-plane:
    name: Merge control-plane manifest
    needs: [tag, build-control-plane-image]
    runs-on: self-hosted
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-control-plane:${TAG} \
            -t ${{ env.GHCR }}/mclaude-control-plane:main \
            ${{ env.GHCR }}/mclaude-control-plane:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-control-plane:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # SPA
  # ---------------------------------------------------------------------------
  build-spa-image:
    name: Docker spa (${{ matrix.arch }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-web
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-spa:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-spa:
    name: Merge spa manifest
    needs: [tag, build-spa-image]
    runs-on: self-hosted
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-spa:${TAG} \
            -t ${{ env.GHCR }}/mclaude-spa:main \
            ${{ env.GHCR }}/mclaude-spa:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-spa:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # Session-agent
  # ---------------------------------------------------------------------------
  build-session-agent-binaries:
    name: Build session-agent binaries
    needs: tag
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-session-agent/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-session-agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o session-agent-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o session-agent-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: session-agent-binaries
          path: |
            mclaude-session-agent/session-agent-arm64
            mclaude-session-agent/session-agent-amd64

  build-session-agent-image:
    name: Docker session-agent (${{ matrix.arch }})
    needs: [tag, build-session-agent-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: session-agent-binaries
          path: mclaude-session-agent
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-session-agent
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-session-agent:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-session-agent:
    name: Merge session-agent manifest
    needs: [tag, build-session-agent-image]
    runs-on: self-hosted
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-session-agent:${TAG} \
            -t ${{ env.GHCR }}/mclaude-session-agent:main \
            ${{ env.GHCR }}/mclaude-session-agent:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-session-agent:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # Controller-k8s
  # ---------------------------------------------------------------------------
  build-controller-k8s-binaries:
    name: Build controller-k8s binaries
    needs: tag
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mclaude-controller-k8s/go.mod
          cache: false
      - name: Build binaries
        working-directory: mclaude-controller-k8s
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o controller-k8s-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o controller-k8s-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: controller-k8s-binaries
          path: |
            mclaude-controller-k8s/controller-k8s-arm64
            mclaude-controller-k8s/controller-k8s-amd64

  build-controller-k8s-image:
    name: Docker controller-k8s (${{ matrix.arch }})
    needs: [tag, build-controller-k8s-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: self-hosted
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: controller-k8s-binaries
          path: mclaude-controller-k8s
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./mclaude-controller-k8s
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.GHCR }}/mclaude-controller-k8s:${{ needs.tag.outputs.image_tag }}-${{ matrix.arch }}

  merge-controller-k8s:
    name: Merge controller-k8s manifest
    needs: [tag, build-controller-k8s-image]
    runs-on: self-hosted
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Create multi-arch manifest
        env:
          TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR }}/mclaude-controller-k8s:${TAG} \
            -t ${{ env.GHCR }}/mclaude-controller-k8s:main \
            ${{ env.GHCR }}/mclaude-controller-k8s:${TAG}-amd64 \
            ${{ env.GHCR }}/mclaude-controller-k8s:${TAG}-arm64

  # ---------------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------------
  deploy-cp:
    name: Deploy control-plane
    needs: [tag, merge-control-plane, merge-spa]
    if: always() && !failure() && !cancelled()
    runs-on: [self-hosted, tailscale]
    environment: deploy
    steps:
      - name: Fetch secrets from Bitwarden
        env:
          BW_SESSION: ${{ secrets.BW_SESSION }}
        run: |
          POSTGRES_PASSWORD=$(bw get password "mclaude postgres password")
          BOOTSTRAP_ADMIN_PASSWORD=$(bw get password "mclaude bootstrap admin password")
          BOOTSTRAP_ADMIN_EMAIL=$(bw get password "mclaude bootstrap admin email")
          [[ -n "$POSTGRES_PASSWORD" ]] || { echo "ERROR: mclaude postgres password is empty"; exit 1; }
          [[ -n "$BOOTSTRAP_ADMIN_PASSWORD" ]] || { echo "ERROR: mclaude bootstrap admin password is empty"; exit 1; }
          [[ -n "$BOOTSTRAP_ADMIN_EMAIL" ]] || { echo "ERROR: mclaude bootstrap admin email is empty"; exit 1; }
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$BOOTSTRAP_ADMIN_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$BOOTSTRAP_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_EMAIL=$BOOTSTRAP_ADMIN_EMAIL" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Ensure prerequisite secrets
        run: |
          kubectl create namespace mclaude-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mclaude-postgres \
            --from-literal=postgres-password="$POSTGRES_PASSWORD" \
            --namespace mclaude-system \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mclaude-control-plane \
            --from-literal=bootstrap-admin-password="$BOOTSTRAP_ADMIN_PASSWORD" \
            --namespace mclaude-system \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Cleanup failed control-plane release
        run: |
          if helm status mclaude-cp -n mclaude-system 2>/dev/null | grep -q "STATUS: failed"; then
            echo "Release mclaude-cp is in failed state — uninstalling to clear SSA ownership"
            helm uninstall mclaude-cp -n mclaude-system
          fi

      - name: Helm deploy control-plane
        env:
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          echo "Deploying control-plane at tag: ${IMAGE_TAG}"
          TS_IP=$(tailscale ip -4)
          helm upgrade --install "mclaude-cp" ./charts/mclaude-cp \
            -f ./charts/mclaude-cp/values-k3d-ghcr.yaml \
            --set controlPlane.image.tag="${IMAGE_TAG}" \
            --set spa.image.tag="${IMAGE_TAG}" \
            --set "controlPlane.bootstrapAdminEmail=${BOOTSTRAP_ADMIN_EMAIL}" \
            --set "controlPlane.bootstrapAdminPassword=${BOOTSTRAP_ADMIN_PASSWORD}" \
            --set "ingress.externalDnsTarget=${TS_IP}" \
            --namespace mclaude-system \
            --force-conflicts \
            --wait --timeout 5m

      - name: Done
        run: echo "✓ CP deployed"

  deploy-worker:
    name: Deploy worker
    needs: [tag, deploy-cp, merge-session-agent, merge-controller-k8s]
    if: false
    runs-on: [self-hosted, tailscale]
    environment: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup failed worker release
        run: |
          if helm status mclaude-worker -n mclaude-system 2>/dev/null | grep -q "STATUS: failed"; then
            echo "Release mclaude-worker is in failed state — uninstalling to clear SSA ownership"
            helm uninstall mclaude-worker -n mclaude-system
          fi

      - name: Helm deploy worker
        env:
          IMAGE_TAG: ${{ needs.tag.outputs.image_tag }}
        run: |
          echo "Deploying worker at tag: ${IMAGE_TAG}"

          # Read trust chain from hub's operator-keys Secret for single-cluster install
          OPERATOR_JWT=$(kubectl get secret operator-keys -n mclaude-system -o jsonpath='{.data.operatorJwt}' | base64 -d)
          ACCOUNT_JWT=$(kubectl get secret operator-keys -n mclaude-system -o jsonpath='{.data.accountJwt}' | base64 -d)
          ACCOUNT_SEED=$(kubectl get secret operator-keys -n mclaude-system -o jsonpath='{.data.accountSeed}' | base64 -d)
          RESOLVER_PRELOAD=$(kubectl get secret operator-keys -n mclaude-system -o jsonpath='{.data.resolverPreload}' | base64 -d)
          ACCOUNT_PUBLIC_KEY=$(kubectl get secret operator-keys -n mclaude-system -o jsonpath='{.data.accountPublicKey}' | base64 -d)

          kubectl delete configmap mclaude-worker-session-agent-template -n mclaude-system --ignore-not-found=true

          helm upgrade --install "mclaude-worker" ./charts/mclaude-worker \
            -f ./charts/mclaude-worker/values-k3d-ghcr.yaml \
            --set controlPlane.image.tag="${IMAGE_TAG}" \
            --set controller.image.tag="${IMAGE_TAG}" \
            --set sessionAgent.image.tag="${IMAGE_TAG}" \
            --set trustChain.operatorJwt="${OPERATOR_JWT}" \
            --set trustChain.accountJwt="${ACCOUNT_JWT}" \
            --set trustChain.accountPublicKey="${ACCOUNT_PUBLIC_KEY}" \
            --set trustChain.resolverPreload="${RESOLVER_PRELOAD}" \
            --namespace mclaude-system \
            --force-conflicts \
            --wait --timeout 5m

      - name: Done
        run: echo "✓ Worker deployed"

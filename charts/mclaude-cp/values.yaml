## mclaude-cp Helm Chart Values
## Control-plane chart: hub NATS, control-plane, SPA.
## Postgres is its own chart (mclaude-postgres). See ADR-0094.
## Ref: ADR-0035, ADR-0094, docs/charts-mclaude/spec-helm.md

global:
  ## Override image registry for all images (air-gapped mirror)
  imageRegistry: ""
  ## Global image pull secrets
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

## Namespace to deploy into. Created if namespace.create is true.
namespace:
  create: true
  name: mclaude-system

## ---------------------------------------------------------------------------
## Hub NATS JetStream
## ---------------------------------------------------------------------------
nats:
  enabled: true
  image:
    registry: docker.io
    repository: nats
    tag: "2.10.24-alpine"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  config:
    ## Max NATS message size (bytes). 8MB to handle large tool results.
    maxPayload: "8388608"
    ## JetStream max file store in bytes (10GB default).
    maxFileStoreSize: "10737418240"
    ## Max NATS protocol control line in bytes. Default NATS value is 4096, which
    ## is too small for user JWTs with multiple host grants (~240 bytes per host).
    ## 16384 supports ~62 concurrent host grants per user.
    maxControlLine: "16384"
    jetstream:
      encryption:
        ## ADR-0091. Name of a Kubernetes Secret holding the JetStream at-rest
        ## encryption key under field "store-key". When set, the NATS ConfigMap
        ## renders a jetstream { ... key: $STORE_KEY } stanza and the NATS
        ## StatefulSet mounts the Secret. Required to protect plaintext tokens
        ## in mclaude-user-info-{uslug} on disk.
        ## Generate with: openssl rand -base64 32
        storeKeySecret: ""
  service:
    clientPort: 4222
    monitorPort: 8222
    websocketPort: 8080
  ## Leaf-node listen port for worker NATS clusters
  leafNodes:
    listenPort: 7422

## ---------------------------------------------------------------------------
## Database connection (ADR-0094)
## Postgres is NOT part of this chart — install charts/mclaude-postgres first
## (or point at a managed DB). Set database.host and database.passwordSecretRef
## on every install.
## ---------------------------------------------------------------------------
database:
  ## DNS-resolvable hostname for Postgres. Required — chart fails if unset.
  ## In-cluster default: mclaude-postgres.mclaude-system.svc
  ## Managed-DB example: foo.us-east-1.rds.amazonaws.com
  host: ""
  ## Postgres port
  port: 5432
  ## Postgres user
  user: mclaude
  ## Postgres database name
  name: mclaude
  ## Name of an existing Secret in the cp namespace with key "postgres-password".
  ## Required — chart fails if unset.
  ## CI creates the Secret via Bitwarden; local dev: kubectl create secret generic
  ## mclaude-postgres --from-literal=postgres-password=$(openssl rand -base64 24)
  passwordSecretRef: ""
  ## Postgres SSL mode in the DSN. Set to "require" (or "verify-full") for
  ## managed-DB environments.
  sslmode: disable

## ---------------------------------------------------------------------------
## Control Plane
## ---------------------------------------------------------------------------
controlPlane:
  enabled: true
  ## External URL for this deployment (e.g. https://mclaude.internal).
  ## Required — template fails at install time if unset.
  externalUrl: ""
  ## First admin's email. The init-keys Job pre-creates a users row with
  ## is_admin=true. First OAuth login matching this email links identity.
  bootstrapAdminEmail: ""
  ## OAuth provider instances.
  providers: []
  image:
    registry: ghcr.io
    repository: richardmsong/mclaude-control-plane
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ## Password for the bootstrap admin. Hashed by the init-keys Job and stored
  ## in users.password_hash. Required for CI to authenticate without OAuth.
  ## If empty, the admin can only log in via OAuth.
  bootstrapAdminPassword: ""
  service:
    type: ClusterIP
    httpPort: 8080
  config:
    logLevel: info
    jwtExpirySeconds: 28800
    jwtRefreshThresholdSeconds: 900
    natsWsUrl: ""
  ## Name of existing Secret containing:
  ##   database-url — Postgres connection string
  existingSecret: "mclaude-control-plane"
  ## Override container command (e.g. for e2e stubs)
  command: []
  ## Whether to run dbmate schema migrations as an init container
  migrations:
    enabled: false
  ## Health probe paths
  probe:
    liveness:
      path: /healthz
    readiness:
      path: /readyz

## ---------------------------------------------------------------------------
## SPA (static web client)
## ---------------------------------------------------------------------------
spa:
  enabled: true
  image:
    registry: ghcr.io
    repository: richardmsong/mclaude-spa
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  command: []

## ---------------------------------------------------------------------------
## MinIO in-cluster S3-compatible object storage (ADR-0067)
## ---------------------------------------------------------------------------
minio:
  enabled: true
  image:
    registry: docker.io
    repository: minio/minio
    tag: "RELEASE.2025-04-22T22-12-26Z"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi
  ## Bucket to create on first install
  bucket: mclaude
  ## Existing Secret with keys "access-key" and "secret-key".
  ## If unset, chart creates the secret using minio.rootUser / minio.rootPassword.
  existingSecret: ""
  rootUser: "minioadmin"
  rootPassword: "minioadmin"
  ## Image for the minio/mc bucket-creation Job (separate from minio server image).
  ## Configurable so air-gapped deployments can mirror from an internal registry.
  mcImage:
    registry: docker.io
    repository: minio/mc
    tag: "latest"
    pullPolicy: IfNotPresent
  ## activeDeadlineSeconds for the minio-bucket hook Job (ADR-0070).
  ## Increased from 120s to allow time for cold image pulls on k3d nodes.
  bucketJobDeadlineSeconds: 300

## ---------------------------------------------------------------------------
## Ingress
## ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
  ## Hostname for the platform
  host: ""
  ## Separate hostname for NATS WebSocket
  natsHost: ""
  ## Hostname for leaf-node ingress (cross-cluster WAN deployments)
  leafHost: ""
  ## Hostname for MinIO S3 API. When set, creates a MinIO Ingress and wires
  ## S3_ENDPOINT on the control-plane Deployment. Must be a direct subdomain of
  ## the wildcard TLS cert (e.g. minio.mclaude.richardmcsong.com).
  minioHost: ""
  tls: []
  ## ExternalDNS A-record target override
  externalDnsTarget: ""

## ---------------------------------------------------------------------------
## Helm test configuration
## ---------------------------------------------------------------------------
tests:
  curl:
    registry: docker.io
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent

## ---------------------------------------------------------------------------
## TLS Certificate (ADR-0097)
## When enabled, the chart renders a cert-manager Certificate CR for the
## wildcard hostname. Carries helm.sh/resource-policy: keep so helm uninstall
## does NOT delete the Certificate or its derived TLS Secret (LE rate-limit safe).
## Default false — each environment overlay opts in explicitly.
## ---------------------------------------------------------------------------
tls:
  certManager:
    enabled: false        # default-disabled: every overlay opts in explicitly
    issuerRef:
      kind: ClusterIssuer
      name: ""            # required when enabled
    commonName: ""        # required when enabled
    dnsNames: []          # required when enabled
    duration: 2160h       # 90d (LE default)
    renewBefore: 720h     # 30d before expiry

## ---------------------------------------------------------------------------
## ServiceAccount for control-plane (no K8s permissions per ADR-0035)
## ---------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

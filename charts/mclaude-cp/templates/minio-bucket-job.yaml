{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mclaude-cp.fullname" . }}-minio-bucket
  namespace: {{ include "mclaude-cp.namespace" . }}
  labels:
    {{- include "mclaude-cp.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-bucket-job
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.minio.bucketJobDeadlineSeconds }}
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "mclaude-cp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-bucket-job
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "mclaude-cp.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-ready
          image: {{ include "mclaude-cp.image" (dict "imageValues" .Values.minio.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - /usr/bin/sh
            - -c
            - {{ printf "/usr/bin/mc alias set local http://%s-minio:9000 $ACCESS_KEY $SECRET_KEY && i=0; while [ $i -lt 60 ]; do /usr/bin/mc ready local && break; i=$((i+1)); sleep 1; done" (include "mclaude-cp.fullname" .) | quote }}
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.minio.existingSecret (printf "%s-minio" (include "mclaude-cp.fullname" .)) }}
                  key: access-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.minio.existingSecret (printf "%s-minio" (include "mclaude-cp.fullname" .)) }}
                  key: secret-key
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/.mc
      containers:
        - name: create-bucket
          image: {{ include "mclaude-cp.image" (dict "imageValues" .Values.minio.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - /usr/bin/sh
            - -c
            - "/usr/bin/mc mb --ignore-existing local/{{ .Values.minio.bucket }}"
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.minio.existingSecret (printf "%s-minio" (include "mclaude-cp.fullname" .)) }}
                  key: access-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ coalesce .Values.minio.existingSecret (printf "%s-minio" (include "mclaude-cp.fullname" .)) }}
                  key: secret-key
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/.mc
      volumes:
        - name: mc-config
          emptyDir: {}
{{- end }}

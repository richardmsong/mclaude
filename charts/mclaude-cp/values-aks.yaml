## AKS Production values for control-plane chart.
## managed-csi-premium storage, scaled replicas.
## Postgres is now in charts/mclaude-postgres — set database.* here. ADR-0094.

nats:
  config:
    maxFileStoreSize: "53687091200"
  persistence:
    storageClass: managed-csi-premium
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

## database.host and database.passwordSecretRef must be set on every install.
## For AKS with in-cluster mclaude-postgres:
##   --set database.host=mclaude-postgres.mclaude-system.svc
##   --set database.passwordSecretRef=mclaude-postgres
## For AKS managed Postgres: override database.host and database.sslmode=require.
database:
  sslmode: require

controlPlane:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

spa:
  replicas: 2

minio:
  persistence:
    storageClass: managed-csi-premium

ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

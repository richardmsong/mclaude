{{- if and .Values.serviceAccount.create .Values.controller.enabled }}
## ClusterRole: the controller needs to manage namespaces, Deployments,
## PVCs, Secrets, ConfigMaps, ServiceAccounts, Roles, and RoleBindings
## across namespaces. MCProject CRD permissions removed per ADR-0091
## (project pod lifecycle delegated to user-agent; no CRD).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mclaude-worker.fullname" . }}-controller
  labels:
    {{- include "mclaude-worker.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  ## Namespace management (user provisioning / deprovisioning)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  ## Deployment management (user-agent Deployments per user namespace)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  ## PVC management (per-project data volumes)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  ## Secret management (per-namespace credentials and token secrets)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  ## ConfigMap management (per-namespace config seeds and templates)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  ## ServiceAccount + RBAC (per-namespace SA for user-agents)
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  ## Leader election (coordination.k8s.io/leases)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
